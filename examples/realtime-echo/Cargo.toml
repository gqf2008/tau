[package]
name = "realtime-echo"
version = "0.1.0"
edition = "2024"
description = "Example tau realtime provider (world realtime): deterministic VAD + full-echo session"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.62", features = ["async-spawn", "inter-task-wakeup"] }
futures = { version = "0.3", default-features = false, features = ["std"] }

[workspace]
