[package]
name = "tau-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "tau command line: print-mode agent with wasm extensions"

[[bin]]
name = "tau"
path = "src/main.rs"

[dependencies]
tau-core = { path = "../tau-core", version = "0.7.0" }
tau-openai = { path = "../tau-openai", version = "0.7.0" }
tau-anthropic = { path = "../tau-anthropic", version = "0.7.0" }
tau-ext = { path = "../tau-ext", version = "0.7.0" }
tau-tools = { path = "../tau-tools", version = "0.7.0" }
serde_json = "1"
anyhow.workspace = true
# The shared-model adapter implements tau-core's async trait.
async-trait.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
rustyline = "18.0.1"
# The editor-attached mode (`--acp`) speaks the Agent Client Protocol
# over stdio directly — Zed's SDK, no adapter process in between.
# Default features only: the `unstable_*` set is draft protocol.
agent-client-protocol = "2.2.0"
# A prompt's images arrive base64; tau's messages carry honest bytes
# (base64 is a JSON-edge encoding — see tau-core's Media).
base64 = "0.23.1"
# Phase 0 realtime-av (docs/realtime-av.md): host-side capture/playback
# (the architecture red line keeps audio I/O out of wasm guests).
cpal = "0.17"
hound = "3.5"
# Phase 2a realtime-av: the live driver polls the session's BoxStream.
futures.workspace = true

[dev-dependencies]
tau-core = { path = "../tau-core", version = "0.7.0" }
async-stream = "0.3"
async-trait.workspace = true
tempfile = "3"
