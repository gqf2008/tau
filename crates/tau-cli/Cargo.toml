[package]
name = "tau-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "tau command line: print-mode agent with wasm extensions"

[[bin]]
name = "tau"
path = "src/main.rs"

[dependencies]
tau-core = { path = "../tau-core" }
tau-openai = { path = "../tau-openai" }
tau-anthropic = { path = "../tau-anthropic" }
tau-ext = { path = "../tau-ext" }
serde_json = "1"
anyhow.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
rustyline = "18.0.1"

[dev-dependencies]
tau-core = { path = "../tau-core" }
futures.workspace = true
async-stream = "0.3"
async-trait.workspace = true
tempfile = "3"
