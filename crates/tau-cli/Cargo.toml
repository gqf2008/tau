[package]
name = "tau-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "tau command line: print-mode agent with wasm extensions"

[[bin]]
name = "tau"
path = "src/main.rs"

[dependencies]
tau-core = { path = "../tau-core", version = "0.2.0" }
tau-openai = { path = "../tau-openai", version = "0.2.0" }
tau-anthropic = { path = "../tau-anthropic", version = "0.2.0" }
tau-ext = { path = "../tau-ext", version = "0.2.0" }
serde_json = "1"
anyhow.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
rustyline = "18.0.1"
# Phase 0 realtime-av (docs/realtime-av.md): host-side capture/playback
# (the architecture red line keeps audio I/O out of wasm guests).
cpal = "0.17"
hound = "3.5"

[dev-dependencies]
tau-core = { path = "../tau-core", version = "0.2.0" }
futures.workspace = true
async-stream = "0.3"
async-trait.workspace = true
tempfile = "3"
