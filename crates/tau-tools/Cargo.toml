[package]
name = "tau-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Built-in native tools for the tau agent harness (read/write/edit/grep/find/ls/bash/powershell)"

[dependencies]
tau-core = { path = "../tau-core", version = "0.6.0" }
serde_json.workspace = true
async-trait.workspace = true
# `~` expansion, the same crate tau-core/tau-ext already use (`dirs` on
# Windows resolves the real profile dir, not $HOME — see docs/media.md).
dirs = "6"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
