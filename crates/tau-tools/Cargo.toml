[package]
name = "tau-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Built-in native tools for the tau agent harness (read/write/edit/grep/find/ls/bash/powershell)"

[dependencies]
tau-core = { path = "../tau-core", version = "0.6.0" }
serde_json.workspace = true
async-trait.workspace = true
# The shell tools wait on a child process with `spawn_blocking`.
tokio.workspace = true
# `~` expansion, the same crate tau-core/tau-ext already use (`dirs` on
# Windows resolves the real profile dir, not $HOME — see docs/media.md).
dirs = "6"
# NFKC in the edit tool's fuzzy matcher, which folds full-width forms
# (an IME artifact) to ASCII the way pi's `String.normalize("NFKC")` does.
unicode-normalization = "0.1"
# grep/find search natively instead of shelling out to ripgrep and fd: `regex`
# is the engine ripgrep itself uses, `ignore` its walker (gitignore, hidden
# files, `.git`), and `globset` its `--glob` semantics. Being on by default,
# these tools cannot require an external binary.
ignore = "0.4"
globset = "0.4"
regex = "1"

[target.'cfg(unix)'.dependencies]
# Killing a timed-out command's process group (see src/shell.rs); Windows
# uses taskkill.exe, which needs no crate.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
