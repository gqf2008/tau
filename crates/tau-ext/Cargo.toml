[package]
name = "tau-ext"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Wasm component extension host for tau (wasmtime; ambient WASI open by default, consent-gated capabilities)"

[dependencies]
tau-core = { path = "../tau-core", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
futures.workspace = true
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
base64 = "0.23"
rand = "0.8"
dirs = "6"
wasmtime = { version = "49.0.1", features = ["cache"] }
wasmtime-wasi = "49.0.1"
