[workspace]
resolver = "2"
members = [
    "crates/tau-core",
    "crates/tau-openai",
    "crates/tau-anthropic",
    "crates/tau-ext",
    "crates/tau-cli",
]
exclude = ["examples/upper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
futures = "0.3"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
